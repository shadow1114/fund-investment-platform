# Additive contract only. Runtime defaults remain v1 until the v3 rules roll out.
# This checkout has no v2 policy; paused catalogs retain the actual v1 baseline.
scheme: FIP_CLASSIFICATION_V1
rule_version: 3.0.0
enum_version: 3.0.0
active_dimensions: [asset_class, strategy]
paused_dimensions: [geography, product_structure, market_attributes]
strategy_tag_catalog: [QUANTITATIVE]
catalog:
  asset_class: [EQUITY, BOND, MIXED, MONEY_MARKET, FOF, REIT, COMMODITY, OTHER, UNKNOWN]
  strategy: [ACTIVE, PASSIVE_INDEX, ENHANCED_INDEX, TARGET_DATE, TARGET_RISK, UNKNOWN]
  geography: [DOMESTIC, US, HK, JP, EUROPE, GLOBAL, MULTI_REGION, UNKNOWN]
  product_structure: [ETF, ETF_LINKED, LOF, ORDINARY, UNKNOWN]
  market_attributes: [DOMESTIC, CROSS_BORDER, QDII, UNKNOWN]
formal_types:
  股票型: EQUITY
  债券型: BOND
  混合型: MIXED
  货币型: MONEY_MARKET
  FOF: FOF
  REIT: REIT
  商品型: COMMODITY
# Ordering is an execution/review hint, never authority to discard contradictions.
strategy_priority: [ENHANCED_INDEX, PASSIVE_INDEX, TARGET_DATE, TARGET_RISK, ACTIVE]
