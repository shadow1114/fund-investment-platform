# Runtime defaults remain v1 until the v3 rules roll out.
# This checkout has no v2 policy; paused catalogs retain the actual v1 baseline.
scheme: FIP_CLASSIFICATION_V1
rule_version: 3.0.0
enum_version: 3.0.0
active_dimensions: [asset_class, strategy]
paused_dimensions: [geography, product_structure, market_attributes]
strategy_tag_catalog: [QUANTITATIVE]
# A type only supplies one half of STR030; adopted fund-level active management is required.
active_non_index_types:
  - 股票型
  - 债券型
  - 混合型
  - 货币型
  - FOF
  - REIT
  - 商品型
  - QDII-混合灵活
  - QDII-普通股票
  - QDII-商品
  - QDII-纯债
  - 债券型-混合一级
  - FOF-均衡型
  - 混合型-偏股
  - 债券型-长债
  - FOF-稳健型
  - QDII-FOF
  - 混合型-绝对收益
  - 债券型-混合二级
  - 货币型-浮动净值
  - 混合型-灵活
  - FOF-进取型
  - 债券型-中短债
  - QDII-混合偏股
  - QDII-混合平衡
  - 混合型-平衡
  - 货币型-普通货币
  - 混合型-偏债
# No implicit risk-control vocabulary is registered as a target-risk mechanism.
target_risk_mechanisms: []
catalog:
  asset_class: [EQUITY, BOND, MIXED, MONEY_MARKET, FOF, REIT, COMMODITY, OTHER, UNKNOWN]
  strategy: [ACTIVE, PASSIVE_INDEX, ENHANCED_INDEX, TARGET_DATE, TARGET_RISK, UNKNOWN]
