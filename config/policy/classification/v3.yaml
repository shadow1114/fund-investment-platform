# Narrow curated fallback, not an authoritative or complete live index directory.
# Exact strings only: no aliases, substring rules, compound targets or geography.
index_asset_mapping_version: "2026-10-27.1"
index_assets:
  沪深300指数:
    asset_class: EQUITY
    provider: CSI
    reference: "https://www.csindex.com.cn/#/indices/family/detail?indexCode=000300"
    verification: CURATED_NOT_LIVE_VERIFIED
  中证全债指数:
    asset_class: BOND
    provider: CSI
    reference: "https://www.csindex.com.cn/#/indices/family/detail?indexCode=H11001"
    verification: CURATED_NOT_LIVE_VERIFIED
  彭博商品指数:
    asset_class: COMMODITY
    provider: BLOOMBERG
    reference: "https://www.bloombergindices.com/bloomberg-commodity-index/"
    verification: CURATED_NOT_LIVE_VERIFIED
# Ordering is an execution/review hint, never authority to discard contradictions.
strategy_priority: [ENHANCED_INDEX, PASSIVE_INDEX, TARGET_DATE, TARGET_RISK, ACTIVE]
