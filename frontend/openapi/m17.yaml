        - fund_ids
        - dataset
        - source
        - actor
        - status
        - requested_count
        - created_at
        - items
      properties:
        operation_id:
          type: string
        fund_id:
          type: string
        fund_ids:
          type: array
          items:
            type: string
        dataset:
          type: string
          enum:
            - BASIC_INFO
            - NAV
        source:
          type: string
        actor:
          type: string
        status:
          type: string
          enum:
            - RUNNING
            - COMPLETED
            - BLOCKED
            - FAILED
            - CANCELLED
        task_status:
          type:
            - string
            - "null"
          enum:
            - SUCCESS
            - PARTIAL_SUCCESS
            - FAILED
            - null
        requested_count:
          type: integer
        success_count:
          type:
            - integer
            - "null"
        failure_count:
          type:
            - integer
            - "null"
        skipped_count:
          type: [integer, "null"]
        cancelled_count:
          type: [integer, "null"]
        scope_type:
          type: [string, "null"]
          enum: [SINGLE, SELECTED, ALL, null]
        parent_operation_id:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/FundIngestionItem"
        failure:
          type:
            - string
            - "null"
