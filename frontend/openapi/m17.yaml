  schemas:
    Error:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required:
        - data
        - meta
        - error
      properties:
        data:
          type: "null"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
        error:
          $ref: "#/components/schemas/Error"
    Pagination:
      type: object
      required:
        - page
        - page_size
        - total_items
        - total_pages
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    VersionReferences:
      type: object
      additionalProperties:
        type: string
    AvailabilityQualityDistribution:
      type: object
      required:
        - EXACT
        - DERIVED
        - INFERRED
      properties:
        EXACT:
          type: number
        DERIVED:
          type: number
        INFERRED:
          type: number
    ResponseMeta:
      type: object
      properties:
        request_id:
          type: string
        as_of_date:
          type: string
          format: date
        data_version:
          type: string
        versions:
          $ref: "#/components/schemas/VersionReferences"
        is_point_in_time:
          type: boolean
        pagination:
          $ref: "#/components/schemas/Pagination"
        availability_quality_distribution:
          $ref: "#/components/schemas/AvailabilityQualityDistribution"
      additionalProperties: true
    EmptyError:
      type: "null"
    MetricStatus:
      type: string
      enum:
        - VALID
        - UNAVAILABLE
        - EXCLUDED
        - UNKNOWN
    NullableMetric:
      description:
        A numeric metric whose unavailable state is never represented as
        zero.
      type: object
      required:
        - value
        - status
        - reason
      properties:
        value:
          type:
            - number
            - "null"
        status:
          $ref: "#/components/schemas/MetricStatus"
        reason:
          type:
            - string
            - "null"
    Session:
      type: object
      required:
        - user_id
        - roles
        - capabilities
      properties:
        user_id:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
              - Researcher
              - Portfolio Manager
              - Quant Researcher
              - Operations
              - Administrator
        capabilities:
          type: object
          required:
            - can_review_decisions
            - can_manage_data_ingestion
          properties:
            can_review_decisions:
              type: boolean
            can_review_classifications:
              type: boolean
            can_manage_data_ingestion:
              type: boolean
            can_manage_full_universe_ingestion:
              type: boolean
    SessionEnvelope:
      type: object
      required:
        - data
        - meta
        - error
      properties:
        data:
          $ref: "#/components/schemas/Session"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
        error:
          $ref: "#/components/schemas/EmptyError"
    Operation:
      type: object
      required:
        - operation_id
        - status
        - progress
        - result_ref
        - failure
      properties:
        operation_id:
          type: string
        status:
          type: string
          enum:
            - RUNNING
            - COMPLETED
            - BLOCKED
            - FAILED
            - CANCELLED
            - UNKNOWN
        progress:
          anyOf:
            - type: object
              required:
                - completed
                - total
                - unit
              properties:
                completed:
                  type: integer
                total:
                  type:
                    - integer
                    - "null"
                unit:
                  type: string
            - type: "null"
        result_ref:
          type:
            - string
            - "null"
        failure:
          anyOf:
            - type: object
              required:
                - code
                - message
              properties:
                code:
                  type: string
                message:
                  type: string
            - type: "null"
    OperationEnvelope:
      type: object
      required:
        - data
        - meta
        - error
      properties:
        data:
          $ref: "#/components/schemas/Operation"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
        error:
          $ref: "#/components/schemas/EmptyError"
    FundIngestionFilters:
      type: object
      additionalProperties: false
      properties:
        fund_name: { type: string }
        fund_type: { type: array, items: { type: string } }
        lifecycle_status: { type: array, items: { type: string } }
        investment_eligibility: { type: array, items: { type: string } }
        asset_class: { type: string }
        strategy: { type: string }
        geography: { type: string }
        product_structure: { type: string }
        market_attributes: { type: string }
        classification_status: { type: string }
    SingleFundScope:
      type: object
      additionalProperties: false
      required: [type, fund_id]
      properties:
        type: { type: string, enum: [SINGLE] }
        fund_id: { type: string, minLength: 1 }
    SelectedFundsScope:
      type: object
      additionalProperties: false
      required: [type, fund_ids]
      properties:
        type: { type: string, enum: [SELECTED] }
        fund_ids:
          {
            type: array,
            minItems: 2,
            maxItems: 100,
            uniqueItems: true,
            items: { type: string, minLength: 1 },
          }
    AllFundsScope:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [ALL] }
        filters: { $ref: "#/components/schemas/FundIngestionFilters" }
    FundIngestionPreviewRequest:
      type: object
      additionalProperties: false
      required: [dataset, scope]
      properties:
        dataset: { type: string, enum: [BASIC_INFO, NAV] }
        scope:
          oneOf:
            - $ref: "#/components/schemas/SingleFundScope"
            - $ref: "#/components/schemas/SelectedFundsScope"
            - $ref: "#/components/schemas/AllFundsScope"
          discriminator:
            propertyName: type
    FundIngestionJobRequest:
      type: object
      additionalProperties: false
      required: [preview_id]
      properties:
        preview_id: { type: string }
    FundIngestionPreview:
      type: object
      required:
        [
          preview_id,
          dataset,
          scope_type,
          fund_count,
          supported_fund_count,
          unavailable_mapping_count,
          subject_count,
          source,
          expires_at,
        ]
      properties:
        preview_id: { type: string }
        dataset: { type: string, enum: [BASIC_INFO, NAV] }
        scope_type: { type: string, enum: [SINGLE, SELECTED, ALL] }
        fund_count: { type: integer }
        supported_fund_count: { type: integer }
        unavailable_mapping_count: { type: integer }
        subject_count: { type: integer }
        source: { type: string }
        expires_at: { type: string, format: date-time }
    FundIngestionPreviewEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data: { $ref: "#/components/schemas/FundIngestionPreview" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        error: { type: "null" }
    FundIngestionRunItem:
      type: object
      additionalProperties: false
      required: [id, fund_id, status, attempts]
      properties:
        id: { type: integer }
        fund_id: { type: string }
        share_class_id: { type: [integer, "null"] }
        symbol: { type: [string, "null"] }
        status:
          {
            type: string,
            enum: [PENDING, RUNNING, SUCCESS, FAILED, SKIPPED, CANCELLED],
          }
        attempts: { type: integer }
        result: { type: [object, "null"], additionalProperties: true }
        error: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    FundIngestionItemsPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FundIngestionRunItem" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    FundIngestionItemsEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data: { $ref: "#/components/schemas/FundIngestionItemsPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        error: { type: "null" }
    FundIngestionHistoryPage:
      type: object
      required: [items, page, page_size, total]
