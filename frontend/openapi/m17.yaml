          type: string
        fund_id:
          type: string
        fund_ids:
          type: array
          items:
            type: string
        dataset:
          type: string
          enum:
            - BASIC_INFO
            - NAV
        status:
          type: string
          enum:
            - RUNNING
            - COMPLETED
            - BLOCKED
            - FAILED
            - CANCELLED
