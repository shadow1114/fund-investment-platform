openapi: 3.1.0
info:
  title: Fund Investment Platform M1.7 Frontend API
  version: 1.0.0
  description: Machine-readable projection of the frozen M1.7 frontend contract.
servers:
  - url: /
paths:
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        "200":
          $ref: "#/components/responses/SessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/operations/{operation_id}:
    get:
      operationId: getOperation
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          $ref: "#/components/responses/OperationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds:
    get:
      operationId: listFunds
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
        - { $ref: "#/components/parameters/AsOfDate" }
        - { name: fund_name, in: query, schema: { type: string } }
        - {
            name: fund_type,
            in: query,
            schema: { type: array, items: { type: string } },
          }
        - { name: management_company_id, in: query, schema: { type: string } }
        - { name: manager_id, in: query, schema: { type: string } }
        - {
            name: lifecycle_status,
            in: query,
            schema:
              {
                type: array,
                items: { $ref: "#/components/schemas/LifecycleStatus" },
              },
          }
        - {
            name: investment_eligibility,
            in: query,
            schema:
              {
                type: array,
                items: { $ref: "#/components/schemas/InvestmentEligibility" },
              },
          }
        - {
            name: inception_date_from,
            in: query,
            schema: { type: string, format: date },
          }
        - {
            name: inception_date_to,
            in: query,
            schema: { type: string, format: date },
          }
        - { name: aum_min, in: query, schema: { type: number } }
        - { name: aum_max, in: query, schema: { type: number } }
      responses:
        "200":
          $ref: "#/components/responses/FundListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds/{fund_id}:
    get:
      operationId: getFund
      parameters:
        - { $ref: "#/components/parameters/FundId" }
        - { $ref: "#/components/parameters/AsOfDate" }
      responses:
        "200":
          $ref: "#/components/responses/FundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds/{fund_id}/nav-series:
    get:
      operationId: getFundNavSeries
      parameters:
        - { $ref: "#/components/parameters/FundId" }
        - { $ref: "#/components/parameters/DateFrom" }
        - { $ref: "#/components/parameters/DateTo" }
        - { $ref: "#/components/parameters/AsOfDate" }
        - {
            name: frequency,
            in: query,
            schema: { type: string, enum: [DAILY, WEEKLY, MONTHLY] },
          }
        - {
            name: nav_type,
            in: query,
            schema: { type: string, enum: [ADJUSTED, RAW], default: ADJUSTED },
          }
      responses:
        "200":
          $ref: "#/components/responses/NavSeriesResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds/{fund_id}/evaluations:
    get:
      operationId: getFundEvaluations
      parameters:
        - { $ref: "#/components/parameters/FundId" }
        - { $ref: "#/components/parameters/EvaluationPeriod" }
        - { $ref: "#/components/parameters/AsOfDate" }
      responses:
        "200":
          $ref: "#/components/responses/FundEvaluationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds/{fund_id}/scores:
    get:
      operationId: getFundScores
      parameters:
        - { $ref: "#/components/parameters/FundId" }
        - { $ref: "#/components/parameters/EvaluationPeriod" }
        - { $ref: "#/components/parameters/AsOfDate" }
      responses:
        "200":
          $ref: "#/components/responses/FundScoreResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/fund-universes:
    get:
      operationId: listUniverses
      parameters:
        - { name: strategy_id, in: query, schema: { type: string } }
        - {
            name: decision_at,
            in: query,
            schema: { type: string, format: date },
          }
        - {
            name: eligibility_rules_version,
            in: query,
            schema: { type: string },
          }
      responses:
        "200":
          $ref: "#/components/responses/UniverseListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/fund-universes/{universe_id}:
    get:
      operationId: getUniverse
      parameters:
        - { $ref: "#/components/parameters/UniverseId" }
      responses:
        "200":
          $ref: "#/components/responses/UniverseResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/portfolios:
    get:
      operationId: listPortfolios
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
      responses:
        "200":
          $ref: "#/components/responses/PortfolioListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/portfolios/{id}:
    get:
      operationId: getPortfolio
      parameters:
        - { $ref: "#/components/parameters/PortfolioId" }
      responses:
        "200":
          $ref: "#/components/responses/PortfolioResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/portfolios/{id}/optimizations:
    post:
      operationId: submitOptimization
      parameters:
        - { $ref: "#/components/parameters/PortfolioId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizationRequest"
      responses:
        "202":
          $ref: "#/components/responses/OptimizationSubmissionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/portfolios/{id}/optimizations/{optimization_id}:
    get:
      operationId: getOptimization
      parameters:
        - { $ref: "#/components/parameters/PortfolioId" }
        - { $ref: "#/components/parameters/OptimizationId" }
      responses:
        "200":
          $ref: "#/components/responses/OptimizationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/decisions/{decision_id}:
    get:
      operationId: getDecision
      parameters:
        - { $ref: "#/components/parameters/DecisionId" }
      responses:
        "200":
          $ref: "#/components/responses/DecisionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/decisions/{decision_id}/review:
    post:
      operationId: reviewDecision
      parameters:
        - { $ref: "#/components/parameters/DecisionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionReviewRequest"
      responses:
        "200":
          $ref: "#/components/responses/DecisionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests:
    post:
      operationId: createBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/BacktestCreatedResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests/{id}/validate-configuration:
    post:
      operationId: validateBacktest
      parameters:
        - { $ref: "#/components/parameters/BacktestId" }
      responses:
        "200":
          $ref: "#/components/responses/BacktestValidationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests/{id}/runs:
    post:
      operationId: runBacktest
      parameters:
        - { $ref: "#/components/parameters/BacktestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202":
          $ref: "#/components/responses/BacktestRunResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests/{id}/status:
    get:
      operationId: getBacktestStatus
      parameters:
        - { $ref: "#/components/parameters/BacktestId" }
      responses:
        "200":
          $ref: "#/components/responses/BacktestStatusResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests/{id}/result:
    get:
      operationId: getBacktestResult
      parameters:
        - { $ref: "#/components/parameters/BacktestId" }
      responses:
        "200":
          $ref: "#/components/responses/BacktestResultResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests/{id}/performance:
    get:
      operationId: getBacktestPerformance
      parameters:
        - { $ref: "#/components/parameters/BacktestId" }
        - { $ref: "#/components/parameters/DateFrom" }
        - { $ref: "#/components/parameters/DateTo" }
        - { name: frequency, in: query, schema: { type: string } }
        - {
            name: segment,
            in: query,
            schema: { type: string, enum: [FULL, IN_SAMPLE, OUT_OF_SAMPLE] },
          }
        - {
            name: include_series,
            in: query,
            schema: { type: array, items: { type: string } },
          }
      responses:
        "200":
          $ref: "#/components/responses/BacktestPerformanceResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests/{id}/bias-check:
    get:
      operationId: getBacktestBiasCheck
      parameters:
        - { $ref: "#/components/parameters/BacktestId" }
      responses:
        "200":
          $ref: "#/components/responses/BacktestBiasCheckResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
components:
  parameters:
    Page:
      {
        name: page,
        in: query,
        schema: { type: integer, minimum: 1, default: 1 },
      }
    PageSize:
      {
        name: page_size,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 500, default: 50 },
      }
    Sort: { name: sort, in: query, schema: { type: string } }
    Order:
      { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
    AsOfDate:
      { name: as_of_date, in: query, schema: { type: string, format: date } }
    DateFrom:
      { name: date_from, in: query, schema: { type: string, format: date } }
    DateTo: { name: date_to, in: query, schema: { type: string, format: date } }
    EvaluationPeriod:
      {
        name: evaluation_period,
        in: query,
        schema: { type: string, enum: [1M, 3M, 6M, 1Y, 3Y, 5Y] },
      }
    FundId:
      { name: fund_id, in: path, required: true, schema: { type: string } }
    UniverseId:
      { name: universe_id, in: path, required: true, schema: { type: string } }
    PortfolioId:
      { name: id, in: path, required: true, schema: { type: string } }
    OptimizationId:
      {
        name: optimization_id,
        in: path,
        required: true,
        schema: { type: string },
      }
    DecisionId:
      { name: decision_id, in: path, required: true, schema: { type: string } }
    BacktestId: { name: id, in: path, required: true, schema: { type: string } }
    OperationId:
      { name: operation_id, in: path, required: true, schema: { type: string } }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, format: uuid },
      }
  responses:
    ErrorResponse:
      description: Unified error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    SessionResponse:
      {
        description: Current authenticated session.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/SessionEnvelope" } },
          },
      }
    OperationResponse:
      {
        description: Asynchronous operation progress.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/OperationEnvelope" } },
          },
      }
    FundListResponse:
      {
        description: Paginated funds.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/FundListEnvelope" } },
          },
      }
    FundResponse:
      {
        description: Fund detail.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/FundEnvelope" } },
          },
      }
    NavSeriesResponse:
      {
        description: Fund NAV series.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/NavSeriesEnvelope" } },
          },
      }
    FundEvaluationResponse:
      {
        description: Fund evaluation.,
        content:
          {
            application/json:
              {
                schema: { $ref: "#/components/schemas/FundEvaluationEnvelope" },
              },
          },
      }
    FundScoreResponse:
      {
        description: Fund score.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/FundScoreEnvelope" } },
          },
      }
    UniverseListResponse:
      {
        description: Fund universes.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/UniverseListEnvelope" } },
          },
      }
    UniverseResponse:
      {
        description: Fund universe snapshot.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/UniverseEnvelope" } },
          },
      }
    PortfolioListResponse:
      {
        description: Paginated portfolios.,
        content:
          {
            application/json:
              {
                schema: { $ref: "#/components/schemas/PortfolioListEnvelope" },
              },
          },
      }
    PortfolioResponse:
      {
        description: Portfolio detail.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/PortfolioEnvelope" } },
          },
      }
    OptimizationSubmissionResponse:
      {
        description: Accepted optimization.,
        content:
          {
            application/json:
              {
                schema:
                  {
                    $ref: "#/components/schemas/OptimizationSubmissionEnvelope",
                  },
              },
          },
      }
    OptimizationResponse:
      {
        description: Optimization result.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/OptimizationEnvelope" } },
          },
      }
    DecisionResponse:
      {
        description: Immutable decision snapshot.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/DecisionEnvelope" } },
          },
      }
    BacktestCreatedResponse:
      {
        description: Created backtest.,
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/BacktestCreatedEnvelope" },
              },
          },
      }
    BacktestValidationResponse:
      {
        description: Backtest configuration validation.,
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/BacktestValidationEnvelope" },
              },
          },
      }
    BacktestRunResponse:
      {
        description: Accepted backtest run.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/BacktestRunEnvelope" } },
          },
      }
    BacktestStatusResponse:
      {
        description: Backtest status.,
        content:
          {
            application/json:
              {
                schema: { $ref: "#/components/schemas/BacktestStatusEnvelope" },
              },
          },
      }
    BacktestResultResponse:
      {
        description: Backtest result summary.,
        content:
          {
            application/json:
              {
                schema: { $ref: "#/components/schemas/BacktestResultEnvelope" },
              },
          },
      }
    BacktestPerformanceResponse:
      {
        description: Backtest performance series.,
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/BacktestPerformanceEnvelope" },
              },
          },
      }
    BacktestBiasCheckResponse:
      {
        description: Backtest bias checks.,
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/BacktestBiasCheckEnvelope" },
              },
          },
      }
  schemas:
    Error:
      type: object
      required: [code, message, details]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    ErrorEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data: { type: "null" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        error: { $ref: "#/components/schemas/Error" }
    Pagination:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }
    VersionReferences:
      type: object
      additionalProperties: { type: string }
    AvailabilityQualityDistribution:
      type: object
      required: [EXACT, DERIVED, INFERRED]
      properties:
        EXACT: { type: number }
        DERIVED: { type: number }
        INFERRED: { type: number }
    ResponseMeta:
      type: object
      properties:
        request_id: { type: string }
        as_of_date: { type: string, format: date }
        data_version: { type: string }
        versions: { $ref: "#/components/schemas/VersionReferences" }
        is_point_in_time: { type: boolean }
        pagination: { $ref: "#/components/schemas/Pagination" }
        availability_quality_distribution:
          { $ref: "#/components/schemas/AvailabilityQualityDistribution" }
      additionalProperties: true
    EmptyError: { type: "null" }
    MetricStatus:
      type: string
      enum: [VALID, UNAVAILABLE, EXCLUDED]
    NullableMetric:
      description: A numeric metric whose unavailable state is never represented as zero.
      type: object
      required: [value, status, reason]
      properties:
        value: { type: [number, "null"] }
        status: { $ref: "#/components/schemas/MetricStatus" }
        reason: { type: [string, "null"] }
    Session:
      type: object
      required: [user_id, roles, capabilities]
      properties:
        user_id: { type: string }
        roles:
          type: array
          items:
            {
              type: string,
              enum:
                [
                  Researcher,
                  Portfolio Manager,
                  Quant Researcher,
                  Operations,
                  Administrator,
                ],
            }
        capabilities:
          type: object
          required: [can_review_decisions]
          properties:
            can_review_decisions: { type: boolean }
    SessionEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data: { $ref: "#/components/schemas/Session" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        error: { $ref: "#/components/schemas/EmptyError" }
    Operation:
      type: object
      required: [operation_id, status, progress, result_ref, failure]
      properties:
        operation_id: { type: string }
        status:
          {
            type: string,
            enum: [RUNNING, COMPLETED, BLOCKED, FAILED, CANCELLED],
          }
        progress:
          anyOf:
            - type: object
              required: [completed, total, unit]
              properties:
                completed: { type: integer }
                total: { type: [integer, "null"] }
                unit: { type: string }
            - type: "null"
        result_ref: { type: [string, "null"] }
        failure:
          anyOf:
            - type: object
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
            - type: "null"
    OperationEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data: { $ref: "#/components/schemas/Operation" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        error: { $ref: "#/components/schemas/EmptyError" }
    LifecycleStatus:
      {
        type: string,
        enum: [NORMAL, SUSPENDED_SUBSCRIPTION, LIQUIDATED, MERGED, TRANSFORMED],
      }
    InvestmentEligibility:
      {
        type: string,
        enum: [FULLY_ELIGIBLE, HOLD_ONLY, LIMITED, EXIT_ONLY, NOT_TRADABLE],
      }
    FundSummary:
      type: object
      required:
        [
          fund_id,
          fund_name,
          share_class,
          fund_classification,
          management_company_id,
          inception_date,
          lifecycle_status,
          investment_eligibility,
        ]
      properties:
        fund_id: { type: string }
        fund_name: { type: string }
        share_class: { type: string }
        fund_classification: { type: string }
        management_company_id: { type: string }
        inception_date: { type: string, format: date }
        lifecycle_status: { $ref: "#/components/schemas/LifecycleStatus" }
        investment_eligibility:
          { $ref: "#/components/schemas/InvestmentEligibility" }
    BenchmarkComponent:
      type: object
      required: [benchmark_id, weight]
      properties:
        benchmark_id: { type: string }
        weight: { type: number }
    Benchmark:
      type: object
      required:
        [
          benchmark_id,
          benchmark_name,
          benchmark_type,
          mapping_version,
          components,
        ]
      properties:
        benchmark_id: { type: string }
        benchmark_name: { type: string }
        benchmark_type: { type: string }
        mapping_version: { type: string }
        components:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/BenchmarkComponent" }
    Fee:
      type: object
      required:
        [
          expense_type,
          expense_rate,
          included_in_nav,
          included_in_backtest,
          inclusion_source,
        ]
      properties:
        expense_type: { type: string }
        expense_rate: { type: number }
        included_in_nav: { type: string, enum: ["TRUE", "FALSE", UNKNOWN] }
        included_in_backtest: { type: boolean }
        inclusion_source: { type: string }
    Fund:
      allOf:
        - { $ref: "#/components/schemas/FundSummary" }
        - type: object
          required:
            [classification_version, manager_ids, benchmark, fee_structure]
          properties:
            classification_version: { type: string }
            manager_ids: { type: array, items: { type: string } }
            benchmark: { $ref: "#/components/schemas/Benchmark" }
            fee_structure:
              { type: array, items: { $ref: "#/components/schemas/Fee" } }
    FundListEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data:
          { type: array, items: { $ref: "#/components/schemas/FundSummary" } }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        error: { $ref: "#/components/schemas/EmptyError" }
    FundEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data: { $ref: "#/components/schemas/Fund" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        error: { $ref: "#/components/schemas/EmptyError" }
    NavPoint:
      type: object
      required: [date, nav, nav_status, nav_reason]
      properties:
        date: { type: string, format: date }
        nav: { type: [number, "null"] }
        nav_status: { $ref: "#/components/schemas/MetricStatus" }
        nav_reason: { type: [string, "null"] }
        reason_code: { type: [string, "null"] }
    NavSeries:
      type: object
      required: [fund_id, points]
      properties:
        fund_id: { type: string }
        points:
          { type: array, items: { $ref: "#/components/schemas/NavPoint" } }
    NavSeriesMeta:
      allOf:
        - { $ref: "#/components/schemas/ResponseMeta" }
        - type: object
          required:
            [
              nav_type,
              adjustment_convention,
              adjustment_rule_version,
              unavailable_count,
