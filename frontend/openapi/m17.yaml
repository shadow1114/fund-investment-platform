openapi: 3.1.0
info:
  title: Fund Investment Platform M1.7 Frontend API
  version: 1.0.0
  description: Machine-readable projection of the frozen M1.7 frontend contract.
servers:
  - url: /
paths:
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        "200":
          $ref: "#/components/responses/SessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/operations/{operation_id}:
    get:
      operationId: getOperation
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          $ref: "#/components/responses/OperationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds:
    get:
      operationId: listFunds
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/AsOfDate"
        - name: fund_name
          in: query
          schema:
            type: string
        - name: fund_type
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: management_company_id
          in: query
          schema:
            type: string
        - name: manager_id
          in: query
          schema:
            type: string
        - name: lifecycle_status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LifecycleStatus"
        - name: investment_eligibility
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/InvestmentEligibility"
        - name: inception_date_from
          in: query
          schema:
            type: string
            format: date
        - name: inception_date_to
          in: query
          schema:
            type: string
            format: date
        - name: aum_min
          in: query
          schema:
            type: number
        - name: aum_max
          in: query
          schema:
            type: number
        - name: asset_class
          in: query
          schema:
            type: string
        - name: strategy
          in: query
          schema:
            type: string
        - name: geography
          in: query
          schema:
            type: string
        - name: product_structure
          in: query
          schema:
            type: string
        - name: market_attributes
          in: query
          schema:
            type: string
        - name: classification_status
          in: query
          schema:
            type: string
        - name: strategy_tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description:
            Matches only evidence-backed CONFIRMED independent tags; legacy QUANTITATIVE strategy
            is not a tag.
          style: form
          explode: false
      responses:
        "200":
          $ref: "#/components/responses/FundListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds/{fund_id}:
    get:
      operationId: getFund
      parameters:
        - $ref: "#/components/parameters/FundId"
        - $ref: "#/components/parameters/AsOfDate"
      responses:
        "200":
          $ref: "#/components/responses/FundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds/{fund_id}/nav-series:
    get:
      operationId: getFundNavSeries
      parameters:
        - $ref: "#/components/parameters/FundId"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/AsOfDate"
        - name: frequency
          in: query
          schema:
            type: string
            enum:
              - DAILY
              - WEEKLY
              - MONTHLY
        - name: nav_type
          in: query
          schema:
            type: string
            enum:
              - ADJUSTED
              - RAW
            default: ADJUSTED
      responses:
        "200":
          $ref: "#/components/responses/NavSeriesResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds/{fund_id}/ingestions:
    post:
      operationId: submitFundIngestion
      parameters:
        - $ref: "#/components/parameters/FundId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundIngestionRequest"
      responses:
        "202":
          $ref: "#/components/responses/FundIngestionSubmissionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    get:
      operationId: listFundIngestions
      parameters:
        - $ref: "#/components/parameters/FundId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          $ref: "#/components/responses/FundIngestionListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/fund-ingestions:
    get:
      operationId: listFundIngestionHistory
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            {
              type: string,
              enum: [RUNNING, COMPLETED, BLOCKED, FAILED, CANCELLED],
            }
        - name: dataset
          in: query
          schema: { type: string, enum: [BASIC_INFO, NAV] }
        - name: scope_type
          in: query
          schema: { type: string, enum: [SINGLE, SELECTED, ALL] }
        - name: created_from
          in: query
          schema: { type: string, format: date-time }
        - name: created_to
          in: query
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          description: Descending order; finished_at puts unfinished operations last.
          schema:
            {
              type: string,
              enum: [created_at, finished_at],
              default: created_at,
            }
      responses:
        "200":
          description: Paginated ingestion history
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/FundIngestionHistoryEnvelope" }
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: submitFundIngestionBatch
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundIngestionBatchRequest"
      responses:
        "202":
          $ref: "#/components/responses/FundIngestionSubmissionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/fund-ingestion-previews:
    post:
      operationId: previewFundIngestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundIngestionPreviewRequest"
      responses:
        "200":
          description: Snapshot counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundIngestionPreviewEnvelope"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/fund-ingestion-jobs:
    post:
      operationId: submitScopedFundIngestion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundIngestionJobRequest"
      responses:
        "202":
          $ref: "#/components/responses/FundIngestionSubmissionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/ingestions/{operation_id}/items:
    get:
      operationId: listFundIngestionItems
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, RUNNING, SUCCESS, FAILED, SKIPPED, CANCELLED]
      responses:
        "200":
          description: Paginated items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundIngestionItemsEnvelope"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/ingestions/{operation_id}/cancel:
    post:
      operationId: cancelFundIngestion
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "202":
          $ref: "#/components/responses/FundIngestionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/ingestions/{operation_id}/retry-failed:
    post:
      operationId: retryFundIngestionFailures
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/FundIngestionSubmissionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds/{fund_id}/basic-info-history:
    get:
      operationId: getFundBasicInfoHistory
      parameters:
        - $ref: "#/components/parameters/FundId"
        - $ref: "#/components/parameters/AsOfDate"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          $ref: "#/components/responses/FundBasicInfoHistoryListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/ingestions/{operation_id}:
    get:
      operationId: getFundIngestion
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          $ref: "#/components/responses/FundIngestionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds/{fund_id}/evaluations:
    get:
      operationId: getFundEvaluations
      parameters:
        - $ref: "#/components/parameters/FundId"
        - $ref: "#/components/parameters/EvaluationPeriod"
        - $ref: "#/components/parameters/AsOfDate"
      responses:
        "200":
          $ref: "#/components/responses/FundEvaluationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds/{fund_id}/scores:
    get:
      operationId: getFundScores
      parameters:
        - $ref: "#/components/parameters/FundId"
        - $ref: "#/components/parameters/EvaluationPeriod"
        - $ref: "#/components/parameters/AsOfDate"
      responses:
        "200":
          $ref: "#/components/responses/FundScoreResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/fund-universes:
    get:
      operationId: listUniverses
      parameters:
        - name: strategy_id
          in: query
          schema:
            type: string
        - name: decision_at
          in: query
          schema:
            type: string
            format: date
        - name: eligibility_rules_version
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/UniverseListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/fund-universes/{universe_id}:
    get:
      operationId: getUniverse
      parameters:
        - $ref: "#/components/parameters/UniverseId"
      responses:
        "200":
          $ref: "#/components/responses/UniverseResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/portfolios:
    get:
      operationId: listPortfolios
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          $ref: "#/components/responses/PortfolioListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/portfolios/{id}:
    get:
      operationId: getPortfolio
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          $ref: "#/components/responses/PortfolioResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/portfolios/{id}/optimizations:
    post:
      operationId: submitOptimization
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizationRequest"
      responses:
        "202":
          $ref: "#/components/responses/OptimizationSubmissionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/portfolios/{id}/optimizations/{optimization_id}:
    get:
      operationId: getOptimization
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
        - $ref: "#/components/parameters/OptimizationId"
      responses:
        "200":
          $ref: "#/components/responses/OptimizationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/decisions/{decision_id}:
    get:
      operationId: getDecision
      parameters:
        - $ref: "#/components/parameters/DecisionId"
      responses:
        "200":
          $ref: "#/components/responses/DecisionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/decisions/{decision_id}/review:
    post:
      operationId: reviewDecision
      parameters:
        - $ref: "#/components/parameters/DecisionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionReviewRequest"
      responses:
        "200":
          $ref: "#/components/responses/DecisionReviewResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests:
    post:
      operationId: createBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/BacktestCreatedResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests/{id}/validate-configuration:
    post:
      operationId: validateBacktest
      parameters:
        - $ref: "#/components/parameters/BacktestId"
      responses:
        "200":
          $ref: "#/components/responses/BacktestValidationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests/{id}/runs:
    post:
      operationId: runBacktest
      parameters:
        - $ref: "#/components/parameters/BacktestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/BacktestRunResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests/{id}/status:
    get:
      operationId: getBacktestStatus
      parameters:
        - $ref: "#/components/parameters/BacktestId"
      responses:
        "200":
          $ref: "#/components/responses/BacktestStatusResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests/{id}/result:
    get:
      operationId: getBacktestResult
      parameters:
        - $ref: "#/components/parameters/BacktestId"
      responses:
        "200":
          $ref: "#/components/responses/BacktestResultResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests/{id}/performance:
    get:
      operationId: getBacktestPerformance
      parameters:
        - $ref: "#/components/parameters/BacktestId"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: frequency
          in: query
          schema:
            type: string
        - name: segment
          in: query
          schema:
            type: string
            enum:
              - FULL
              - IN_SAMPLE
              - OUT_OF_SAMPLE
        - name: include_series
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          $ref: "#/components/responses/BacktestPerformanceResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/backtests/{id}/bias-check:
    get:
      operationId: getBacktestBiasCheck
      parameters:
        - $ref: "#/components/parameters/BacktestId"
      responses:
        "200":
          $ref: "#/components/responses/BacktestBiasCheckResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/fund-classifications/catalog:
    get:
      summary: Catalog
      operationId: getClassificationCatalog
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypedEnvelope_CatalogPayload_"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/funds/{fund_id}/classification-history:
    get:
      summary: History
      operationId: getClassificationHistory
      parameters:
        - name: fund_id
          in: path
          required: true
          schema:
            type: string
            title: Fund Id
        - name: decision_at
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: date
              - type: "null"
            title: Decision At
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypedEnvelope_list_ClassificationHistoryPayload__"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/classification-reviews:
    get:
      summary: List Reviews
      operationId: listClassificationReviews
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 500
            minimum: 1
            default: 20
            title: Page Size
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            default: PENDING
            title: Status
        - name: decision_at
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: date
              - type: "null"
            title: Decision At
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - HISTORY
            default: ACTIVE
          description:
            ACTIVE omits paused historical cases; HISTORY includes them. Status and PIT filters
            apply in both scopes.
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypedEnvelope_list_ReviewCasePayload__"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/classification-reviews/{case_id}:
    get:
      summary: Get Review
      operationId: getClassificationReview
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: integer
            title: Case Id
        - name: decision_at
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: date
              - type: "null"
            title: Decision At
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypedEnvelope_ReviewCasePayload_"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/classification-reviews/{case_id}/review:
    post:
      summary: Review
      operationId: reviewClassification
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: integer
            title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSubmission"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypedEnvelope_ReviewOutcome_"
        default:
          $ref: "#/components/responses/ErrorResponse"
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
    AsOfDate:
      name: as_of_date
      in: query
      schema:
        type: string
        format: date
    DateFrom:
      name: date_from
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      schema:
        type: string
        format: date
    EvaluationPeriod:
      name: evaluation_period
      in: query
      schema:
        type: string
        enum:
          - 1M
          - 3M
          - 6M
          - 1Y
          - 3Y
          - 5Y
    FundId:
      name: fund_id
      in: path
      required: true
      schema:
        type: string
    UniverseId:
      name: universe_id
      in: path
      required: true
      schema:
        type: string
    PortfolioId:
      name: id
      in: path
      required: true
      schema:
        type: string
    OptimizationId:
      name: optimization_id
      in: path
      required: true
      schema:
        type: string
    DecisionId:
      name: decision_id
      in: path
      required: true
      schema:
        type: string
    BacktestId:
      name: id
      in: path
      required: true
      schema:
        type: string
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ErrorResponse:
      description: Unified error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SessionResponse:
      description: Current authenticated session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionEnvelope"
    OperationResponse:
      description: Asynchronous operation progress.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationEnvelope"
    FundIngestionSubmissionResponse:
      description: Accepted fund data ingestion job.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FundIngestionSubmissionEnvelope"
    FundIngestionListResponse:
      description: Recent ingestion jobs for a fund.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FundIngestionListEnvelope"
    FundIngestionResponse:
      description: Fund data ingestion job status and item results.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FundIngestionEnvelope"
    FundBasicInfoHistoryListResponse:
      description: Versioned fund overview snapshots visible at the requested date.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FundBasicInfoHistoryListEnvelope"
    FundListResponse:
      description: Paginated funds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FundListEnvelope"
    FundResponse:
      description: Fund detail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FundEnvelope"
    NavSeriesResponse:
      description: Fund NAV series.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NavSeriesEnvelope"
    FundEvaluationResponse:
      description: Fund evaluation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FundEvaluationEnvelope"
    FundScoreResponse:
      description: Fund score.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FundScoreEnvelope"
    UniverseListResponse:
      description: Fund universes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UniverseListEnvelope"
    UniverseResponse:
