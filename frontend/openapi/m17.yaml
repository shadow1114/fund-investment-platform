      type: object
      required:
        [
          backtest_id,
          status,
          validation_status,
          backtest_mode,
          period,
          initial_capital,
          final_value,
          summary,
          excess_return,
          significance_verdict,
          validation_summary,
        ]
      properties:
        backtest_id: { type: string }
        status: { type: string }
        validation_status: { type: string, enum: [VALID, WARNING, INVALID] }
        backtest_mode:
          { type: string, enum: [HISTORICAL_FIDELITY, CURRENT_RULE] }
        period:
          type: object
          required: [start_date, end_date, warm_up_end_date]
          properties:
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            warm_up_end_date: { type: string, format: date }
        initial_capital: { $ref: "#/components/schemas/Money" }
        final_value: { $ref: "#/components/schemas/Money" }
        summary:
          type: object
          required: [portfolio, benchmark, equal_weight_baseline]
          properties:
            portfolio: { $ref: "#/components/schemas/PerformanceMetrics" }
            benchmark: { $ref: "#/components/schemas/PerformanceMetrics" }
            equal_weight_baseline:
              { $ref: "#/components/schemas/PerformanceMetrics" }
        excess_return:
          type: object
          required: [vs_benchmark, vs_equal_weight]
          properties:
            vs_benchmark: { type: number }
            vs_equal_weight: { type: number }
        significance_verdict:
          type: object
          required: [overall, thresholds_status, layers]
          properties:
            overall:
              {
                type: string,
                enum: [SIGNIFICANT, NOT_SIGNIFICANT, CANNOT_DETERMINE],
              }
            thresholds_status:
              { type: string, enum: [CALIBRATED, PENDING_CALIBRATION] }
            layers:
              type: object
              required: [statistical, effect_size, robustness, economic]
              properties:
                statistical: { $ref: "#/components/schemas/SignificanceLayer" }
                effect_size: { $ref: "#/components/schemas/SignificanceLayer" }
                robustness: { $ref: "#/components/schemas/SignificanceLayer" }
                economic: { $ref: "#/components/schemas/SignificanceLayer" }
        validation_summary:
          type: object
          required: [warnings, invalid_reasons]
          properties:
            warnings: { type: array, items: { type: string } }
            invalid_reasons: { type: array, items: { type: string } }
    BacktestResultMeta:
      allOf:
        - { $ref: "#/components/schemas/ResponseMeta" }
        - type: object
          required:
            [
              configuration_version,
              data_version,
              strategy_versions,
              code_version,
              transaction_cost_model_version,
              methodology_policy_version,
              report_policy_version,
            ]
          properties:
            configuration_version: { type: string }
            data_version: { type: string }
            strategy_versions:
              type: object
              required:
                [
                  metric_version,
                  scoring_version,
                  portfolio_rule_version,
                  rebalance_rule_version,
                  return_estimate_version,
                  risk_model_version,
                  eligibility_universe_version,
                  benchmark_version,
                  peer_group_classification_version,
                ]
              properties:
                metric_version: { type: string }
                scoring_version: { type: string }
                portfolio_rule_version: { type: string }
                rebalance_rule_version: { type: string }
                return_estimate_version: { type: string }
                risk_model_version: { type: string }
                eligibility_universe_version: { type: string }
                benchmark_version: { type: string }
                peer_group_classification_version: { type: string }
            code_version: { type: string }
            transaction_cost_model_version: { type: string }
            methodology_policy_version: { type: string }
            report_policy_version: { type: string }
    BacktestResultEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data: { $ref: "#/components/schemas/BacktestResult" }
        meta: { $ref: "#/components/schemas/BacktestResultMeta" }
        error: { $ref: "#/components/schemas/EmptyError" }
    SeriesPoint:
      type: object
      required: [date, value]
      properties:
        date: { type: string, format: date }
        value: { type: [number, string, "null"] }
        value_status: { $ref: "#/components/schemas/MetricStatus" }
        value_reason: { type: [string, "null"] }
    BacktestPerformance:
      type: object
      required: [segment, series]
      properties:
        segment: { type: string, enum: [FULL, IN_SAMPLE, OUT_OF_SAMPLE] }
        series:
          type: object
          required:
            [
              portfolio_value,
              cumulative_return,
              drawdown,
              rolling_sharpe,
              rolling_excess_return,
            ]
          properties:
            portfolio_value:
              {
                type: array,
                items: { $ref: "#/components/schemas/SeriesPoint" },
              }
            cumulative_return:
              type: object
              required: [portfolio, benchmark, equal_weight_baseline]
              properties:
                portfolio:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/SeriesPoint" },
                  }
                benchmark:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/SeriesPoint" },
                  }
                equal_weight_baseline:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/SeriesPoint" },
                  }
            drawdown:
              {
                type: array,
                items: { $ref: "#/components/schemas/SeriesPoint" },
              }
            rolling_sharpe:
              {
                type: array,
                items: { $ref: "#/components/schemas/SeriesPoint" },
              }
            rolling_excess_return:
              {
                type: array,
                items: { $ref: "#/components/schemas/SeriesPoint" },
              }
    BacktestPerformanceEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data: { $ref: "#/components/schemas/BacktestPerformance" }
        meta:
          allOf:
            - { $ref: "#/components/schemas/ResponseMeta" }
            - type: object
              required: [warm_up_end_date]
              properties:
                warm_up_end_date: { type: string, format: date }
        error: { $ref: "#/components/schemas/EmptyError" }
    BiasStatus:
      {
        type: string,
        enum: [PASS, FAIL, NOT_VERIFIED, PARTIALLY_MODELED, NOT_MODELED],
      }
    BiasCheck:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/BiasStatus" }
        violations: { type: array, items: { type: string } }
        reason: { type: string }
        affected_periods: { type: integer }
        availability_quality_distribution:
          { $ref: "#/components/schemas/AvailabilityQualityDistribution" }
        unmodeled_costs: { type: array, items: { type: string } }
    BacktestBiasCheck:
      type: object
      required: [backtest_id, checks, snapshot_summary, data_limitations]
      properties:
        backtest_id: { type: string }
        checks:
          type: object
          required:
            [
              look_ahead_bias,
              survivorship_bias,
              tradability_bias,
              point_in_time,
              transaction_cost,
              subscription_redemption_lag,
            ]
          properties:
            look_ahead_bias: { $ref: "#/components/schemas/BiasCheck" }
            survivorship_bias: { $ref: "#/components/schemas/BiasCheck" }
            tradability_bias: { $ref: "#/components/schemas/BiasCheck" }
            point_in_time: { $ref: "#/components/schemas/BiasCheck" }
            transaction_cost: { $ref: "#/components/schemas/BiasCheck" }
            subscription_redemption_lag:
              { $ref: "#/components/schemas/BiasCheck" }
        snapshot_summary:
          type: object
          required:
            [
              snapshot_periods,
              rebuilt_periods,
              total_periods,
              rebuilt_period_list,
            ]
          properties:
            snapshot_periods: { type: integer }
            rebuilt_periods: { type: integer }
            total_periods: { type: integer }
            rebuilt_period_list:
              { type: array, items: { type: string, format: date } }
        data_limitations: { type: array, items: { type: string } }
    BacktestBiasCheckEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data: { $ref: "#/components/schemas/BacktestBiasCheck" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
        error: { $ref: "#/components/schemas/EmptyError" }
